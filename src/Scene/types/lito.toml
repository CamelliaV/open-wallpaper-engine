[package]
name = "owe-types"
version.workspace = true

[lib]
name = "owe-types"
module = "wescene.types"
archive = "owe-types"
sources = ["types.cppm", "types.cpp"]

[usage]
private-options = [
  "-Wextra",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]
private-linker-options = ["-ldl"]

[dependencies.owe-core]
workspace = true
visibility = "public"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-cppstd]
workspace = true
visibility = "public"
