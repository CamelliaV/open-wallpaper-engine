[package]
name = "owe-core"
version.workspace = true
module = "owe.core"
source-root = "../.."

[library]
archive = "owe-core"
discovery = "explicit"
sources = [
  "src/Core/Cli.cppm",
  "src/Core/Core.cppm",
  "src/Core/Fft.cppm",
  "src/Core/Fft.cpp",
  "src/Core/Fs.cppm",
  "src/Core/Fs/Fs.cppm",
  "src/Core/IO/Binary.cppm",
  "src/Core/Json.cppm",
  "src/Core/Json.cpp",
  "src/Core/UserProperty.cppm",
  "src/Core/UserProperty.cpp",
  "src/Core/eigen.cppm",
]

[usage]
public-include-directories = ["third_party", "src", "src/Core"]
public-definitions = ["FT_SIZEOF_LONG=8"]
public-options = ["-fPIC", "-fsized-deallocation"]
private-options = [
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]
private-linker-options = ["-pthread", "-ldl"]

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-cppstd]
workspace = true
visibility = "public"

[dependencies.rstd-json]
workspace = true
visibility = "public"

[dependencies.rstd-log]
workspace = true
visibility = "public"

[dependencies.rstd-argparse]
workspace = true
visibility = "public"

[external-dependencies.cmake.eigen]
workspace = true
targets = [{ name = "Eigen3::Eigen", visibility = "public" }]
