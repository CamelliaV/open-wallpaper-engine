[package]
name = "owe-web"
version.workspace = true
module = "weweb"

[library]
archive = "owe-web"
discovery = "explicit"
sources = [
  "Web.cppm",
  "DmaBufFrame.cppm",
  "Manifest.cppm",
  "BrowserHost.cppm",
  "Cef.cppm",
  "CefInternal.cppm",
  "Manifest.cpp",
  "UserProperties.cpp",
  "AppHandler.cpp",
  "ClientHandler.cpp",
  "OsrRenderHandler.cpp",
  "BrowserHost.cpp",
]

[usage]
public-include-directories = ["."]
public-options = ["-fPIC", "-fsized-deallocation"]
private-options = [
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]
private-linker-options = ["-pthread", "-ldl"]

[dependencies.owe-core]
workspace = true
visibility = "public"

[dependencies.rstd-std]
workspace = true
visibility = "public"

[dependencies.rstd-cppstd]
workspace = true
visibility = "public"

[external-dependencies.cmake.cef]
workspace = true
targets = [
  { name = "libcef_lib", visibility = "public" },
  { name = "libcef_dll_wrapper", visibility = "public" },
]
