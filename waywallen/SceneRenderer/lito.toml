[package]
name = "owe-waywallen-scene-renderer"
version.workspace = true
module = "waywallen.scene_entry"
source-root = ".."

[executable]
name = "waywallen-wescene-renderer"
discovery = "explicit"
sources = [
  "scene_entry.cppm",
  "scene_entry.cpp",
  "BridgeExSwapchain.cppm",
  "BridgeExSwapchain.cpp",
  "scene_main.cpp",
]

[usage]
private-options = [
  "-fPIC",
  "-fsized-deallocation",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]
private-linker-options = ["-pthread", "-ldl"]

[dependencies.owe-core]
workspace = true
visibility = "private"

[dependencies.owe-scene]
workspace = true
visibility = "private"

[dependencies.owe-vulkan]
workspace = true
visibility = "private"

[dependencies.owe-waywallen-producer]
workspace = true
visibility = "private"

[dependencies.rstd-argparse]
workspace = true
visibility = "private"

[dependencies.rstd-cppstd]
workspace = true
visibility = "private"

[dependencies.rstd-log]
workspace = true
visibility = "private"

[dependencies.rstd-std]
workspace = true
visibility = "private"
