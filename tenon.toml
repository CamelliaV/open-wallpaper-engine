[usage]
private-include-directories = [
  "third_party",
  "src",
  "src/Core",
  "src/Scene",
  "src/Scene/Utils",
  "src/Scene/Utils/include",
  "src/Scene/Utils/include/Utils",
  "src/Scene/Scene",
  "src/Scene/Particle",
  "src/Scene/Script",
  "src/Vulkan",
  "tests",
  "third_party/tenon/glslang",
]
private-definitions = [
  'WAYWALLEN_WORKSHOP_DIR="workshop"',
  'WAYWALLEN_ASSETS_DIR="assets"',
  'WAYWALLEN_FIXTURE_DIR="tests/fixtures"',
  "FT_SIZEOF_LONG=8",
]
private-options = [
  "-fPIC",
  "-fsized-deallocation",
  "-Wall",
  "-Wextra",
  "-Wpedantic",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]
private-linker-options = ["-pthread", "-ldl"]

[dependencies.rstd-std]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.rstd-cppstd]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.rstd-json]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.rstd-log]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.rstd-argparse]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.rstd-bench]
git = "https://github.com/litocpp/rstd.git"
visibility = "private"

[dependencies.wavsen-audio]
git = "https://github.com/hypengw/wavsen.git"
visibility = "private"

[dependencies.vvk]
git = "https://github.com/litocpp/vvk.git"
visibility = "private"

[external-dependencies.cmake.eigen]
find-package = "Eigen3"
git = "https://gitlab.com/libeigen/eigen.git"
rev = "bc3b39870ecb690a623a3f49149a358b95c5781d"
cache = { BUILD_TESTING = false, EIGEN_BUILD_TESTING = false, EIGEN_BUILD_BLAS = false, EIGEN_BUILD_LAPACK = false, EIGEN_BUILD_DOC = false, EIGEN_BUILD_DEMOS = false, EIGEN_BUILD_PKGCONFIG = false, EIGEN_BUILD_CMAKE_PACKAGE = true }
targets = [{ name = "Eigen3::Eigen", visibility = "private" }]

[external-dependencies.cmake.quickjs]
find-package = "qjs"
git = "https://github.com/quickjs-ng/quickjs.git"
rev = "3c051980ab7e783dfbfb1c70c014ce5e05ecf24c"
config-directory = "lib/cmake/quickjs"
cache = { BUILD_SHARED_LIBS = false, QJS_BUILD_EXAMPLES = false, QJS_BUILD_CLI_STATIC = false, QJS_BUILD_CLI_WITH_MIMALLOC = false, QJS_BUILD_CLI_WITH_STATIC_MIMALLOC = false, QJS_ENABLE_INSTALL = true }
targets = [{ name = "qjs", visibility = "private" }]

[external-dependencies.cmake.glslang]
find-package = "glslang"
git = "https://github.com/KhronosGroup/glslang.git"
rev = "275822a6261ee689aadb1da5f09a0ec2f058685c"
cache = { ENABLE_GLSLANG_BINARIES = false, ENABLE_HLSL = true, ENABLE_OPT = false, ENABLE_CTEST = false, BUILD_EXTERNAL = false, GLSLANG_TESTS = false, BUILD_TESTING = false }
targets = [
  { name = "glslang::glslang", visibility = "private" },
  { name = "glslang::SPIRV", visibility = "private" },
  { name = "glslang::glslang-default-resource-limits", visibility = "private" },
]

[dependencies.spirv-reflect]
git = "https://github.com/hypengw/SPIRV-Reflect.git"
visibility = "private"

[external-dependencies.pkg-config.lz4]
module = "liblz4"
visibility = "private"

[external-dependencies.pkg-config.fontconfig]
module = "fontconfig"
visibility = "private"

[external-dependencies.pkg-config.freetype]
module = "freetype2"
visibility = "private"
